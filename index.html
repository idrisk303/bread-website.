<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread - The Future Starts Here</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:radial-gradient(circle at top,#3d2a00,#050505);
}

.logo{
font-size:60px;
margin-bottom:20px;
animation:float 3s ease-in-out infinite;
}

h1{
font-size:52px;
font-weight:900;
color:#FFD700;
}

p{
margin-top:20px;
font-size:20px;
max-width:700px;
line-height:1.8;
color:#d7d7d7;
}

button{
margin-top:35px;
padding:18px 45px;
border:none;
border-radius:50px;
background:#FFD700;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 35px gold;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}
</style>

</head>

<body>

<section class="hero">

<div class="logo">🍞</div>

<h1>BREAD</h1>

<p>
A new generation Web3 ecosystem built for builders,
believers and the future of decentralisation.
Simple. Powerful. Community First.
</p>

<button>Join Community</button>

</section>

</body>
</html>
